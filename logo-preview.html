<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>保定智镜科技 — Logo System</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #f9f9fb;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 48px;
    color: #1d1d1f;
  }
  h1 { font-size:11px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:#86868b; margin-bottom:40px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .card { background:#fff; border-radius:16px; padding:36px; border:1px solid rgba(0,0,0,.06); box-shadow:0 4px 20px rgba(0,0,0,.05); display:flex; flex-direction:column; gap:20px; }
  .card--dark { background:#000; border-color:transparent; }
  .card--bg { background:#f5f1ea; }
  .card-label { font-size:10px; font-weight:700; letter-spacing:.15em; text-transform:uppercase; color:#86868b; }
  .card--dark .card-label { color:rgba(255,255,255,.3); }
  .card--bg .card-label { color:rgba(0,0,0,.35); }
  .logo-full { display:flex; align-items:center; gap:14px; }
  .logo-text { font-size:22px; font-weight:700; letter-spacing:-.04em; color:#1d1d1f; }
  .logo-text--white { color:#fff; }
  .size-row { display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
  .size-item { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .size-label { font-size:10px; color:#86868b; font-weight:500; }
</style>
</head>
<body>
<h1>保定智镜科技 — Logo System</h1>
<div class="grid">

  <div class="card">
    <div class="card-label">完整 Logo / 浅色背景</div>
    <div class="logo-full">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" width="48" height="48">
        <line x1="32" y1="32" x2="32" y2="14" stroke="#000" stroke-width="1" stroke-opacity=".12"/>
        <line x1="32" y1="32" x2="32" y2="50" stroke="#000" stroke-width="1" stroke-opacity=".12"/>
        <line x1="32" y1="32" x2="14" y2="32" stroke="#000" stroke-width="1" stroke-opacity=".12"/>
        <line x1="32" y1="32" x2="50" y2="32" stroke="#000" stroke-width="1" stroke-opacity=".12"/>
        <line x1="32" y1="32" x2="19.9" y2="19.9" stroke="#000" stroke-width="1" stroke-opacity=".07"/>
        <line x1="32" y1="32" x2="44.1" y2="19.9" stroke="#000" stroke-width="1" stroke-opacity=".07"/>
        <line x1="32" y1="32" x2="19.9" y2="44.1" stroke="#000" stroke-width="1" stroke-opacity=".07"/>
        <line x1="32" y1="32" x2="44.1" y2="44.1" stroke="#000" stroke-width="1" stroke-opacity=".07"/>
        <circle cx="32" cy="10" r="4.5" fill="#000" opacity=".5"/>
        <circle cx="32" cy="54" r="4.5" fill="#000" opacity=".5"/>
        <circle cx="10" cy="32" r="4.5" fill="#000" opacity=".5"/>
        <circle cx="54" cy="32" r="4.5" fill="#000" opacity=".5"/>
        <circle cx="16.7" cy="16.7" r="3.2" fill="#000" opacity=".28"/>
        <circle cx="47.3" cy="16.7" r="3.2" fill="#000" opacity=".28"/>
        <circle cx="16.7" cy="47.3" r="3.2" fill="#000" opacity=".28"/>
        <circle cx="47.3" cy="47.3" r="3.2" fill="#000" opacity=".28"/>
        <circle cx="32" cy="32" r="10" fill="#000" opacity=".95"/>
      </svg>
      <span class="logo-text">保定智镜科技</span>
    </div>
  </div>

  <div class="card card--dark">
    <div class="card-label">完整 Logo / 深色背景</div>
    <div class="logo-full">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" width="48" height="48">
        <line x1="32" y1="32" x2="32" y2="14" stroke="#fff" stroke-width="1" stroke-opacity=".15"/>
        <line x1="32" y1="32" x2="32" y2="50" stroke="#fff" stroke-width="1" stroke-opacity=".15"/>
        <line x1="32" y1="32" x2="14" y2="32" stroke="#fff" stroke-width="1" stroke-opacity=".15"/>
        <line x1="32" y1="32" x2="50" y2="32" stroke="#fff" stroke-width="1" stroke-opacity=".15"/>
        <line x1="32" y1="32" x2="19.9" y2="19.9" stroke="#fff" stroke-width="1" stroke-opacity=".08"/>
        <line x1="32" y1="32" x2="44.1" y2="19.9" stroke="#fff" stroke-width="1" stroke-opacity=".08"/>
        <line x1="32" y1="32" x2="19.9" y2="44.1" stroke="#fff" stroke-width="1" stroke-opacity=".08"/>
        <line x1="32" y1="32" x2="44.1" y2="44.1" stroke="#fff" stroke-width="1" stroke-opacity=".08"/>
        <circle cx="32" cy="10" r="4.5" fill="#fff" opacity=".5"/>
        <circle cx="32" cy="54" r="4.5" fill="#fff" opacity=".5"/>
        <circle cx="10" cy="32" r="4.5" fill="#fff" opacity=".5"/>
        <circle cx="54" cy="32" r="4.5" fill="#fff" opacity=".5"/>
        <circle cx="16.7" cy="16.7" r="3.2" fill="#fff" opacity=".28"/>
        <circle cx="47.3" cy="16.7" r="3.2" fill="#fff" opacity=".28"/>
        <circle cx="16.7" cy="47.3" r="3.2" fill="#fff" opacity=".28"/>
        <circle cx="47.3" cy="47.3" r="3.2" fill="#fff" opacity=".28"/>
        <circle cx="32" cy="32" r="10" fill="#fff" opacity=".95"/>
      </svg>
      <span class="logo-text logo-text--white">保定智镜科技</span>
    </div>
  </div>

  <div class="card card--bg">
    <div class="card-label">图标 Mark / 多尺寸</div>
    <div class="size-row">
      <div class="size-item">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" width="96" height="96">
          <line x1="32" y1="32" x2="32" y2="14" stroke="#000" stroke-width="1" stroke-opacity=".12"/>
          <line x1="32" y1="32" x2="32" y2="50" stroke="#000" stroke-width="1" stroke-opacity=".12"/>
          <line x1="32" y1="32" x2="14" y2="32" stroke="#000" stroke-width="1" stroke-opacity=".12"/>
          <line x1="32" y1="32" x2="50" y2="32" stroke="#000" stroke-width="1" stroke-opacity=".12"/>
          <line x1="32" y1="32" x2="19.9" y2="19.9" stroke="#000" stroke-width="1" stroke-opacity=".07"/>
          <line x1="32" y1="32" x2="44.1" y2="19.9" stroke="#000" stroke-width="1" stroke-opacity=".07"/>
          <line x1="32" y1="32" x2="19.9" y2="44.1" stroke="#000" stroke-width="1" stroke-opacity=".07"/>
          <line x1="32" y1="32" x2="44.1" y2="44.1" stroke="#000" stroke-width="1" stroke-opacity=".07"/>
          <circle cx="32" cy="10" r="4.5" fill="#000" opacity=".5"/>
          <circle cx="32" cy="54" r="4.5" fill="#000" opacity=".5"/>
          <circle cx="10" cy="32" r="4.5" fill="#000" opacity=".5"/>
          <circle cx="54" cy="32" r="4.5" fill="#000" opacity=".5"/>
          <circle cx="16.7" cy="16.7" r="3.2" fill="#000" opacity=".28"/>
          <circle cx="47.3" cy="16.7" r="3.2" fill="#000" opacity=".28"/>
          <circle cx="16.7" cy="47.3" r="3.2" fill="#000" opacity=".28"/>
          <circle cx="47.3" cy="47.3" r="3.2" fill="#000" opacity=".28"/>
          <circle cx="32" cy="32" r="10" fill="#000" opacity=".95"/>
        </svg>
        <span class="size-label">96px</span>
      </div>
      <div class="size-item">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" width="64" height="64">
          <line x1="32" y1="32" x2="32" y2="14" stroke="#000" stroke-width="1" stroke-opacity=".12"/>
          <line x1="32" y1="32" x2="32" y2="50" stroke="#000" stroke-width="1" stroke-opacity=".12"/>
          <line x1="32" y1="32" x2="14" y2="32" stroke="#000" stroke-width="1" stroke-opacity=".12"/>
          <line x1="32" y1="32" x2="50" y2="32" stroke="#000" stroke-width="1" stroke-opacity=".12"/>
          <circle cx="32" cy="10" r="4.5" fill="#000" opacity=".5"/>
          <circle cx="32" cy="54" r="4.5" fill="#000" opacity=".5"/>
          <circle cx="10" cy="32" r="4.5" fill="#000" opacity=".5"/>
          <circle cx="54" cy="32" r="4.5" fill="#000" opacity=".5"/>
          <circle cx="16.7" cy="16.7" r="3.2" fill="#000" opacity=".28"/>
          <circle cx="47.3" cy="16.7" r="3.2" fill="#000" opacity=".28"/>
          <circle cx="16.7" cy="47.3" r="3.2" fill="#000" opacity=".28"/>
          <circle cx="47.3" cy="47.3" r="3.2" fill="#000" opacity=".28"/>
          <circle cx="32" cy="32" r="10" fill="#000" opacity=".95"/>
        </svg>
        <span class="size-label">64px</span>
      </div>
      <div class="size-item">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" width="40" height="40">
          <circle cx="32" cy="10" r="4.5" fill="#000" opacity=".5"/>
          <circle cx="32" cy="54" r="4.5" fill="#000" opacity=".5"/>
          <circle cx="10" cy="32" r="4.5" fill="#000" opacity=".5"/>
          <circle cx="54" cy="32" r="4.5" fill="#000" opacity=".5"/>
          <circle cx="32" cy="32" r="10" fill="#000" opacity=".95"/>
        </svg>
        <span class="size-label">40px</span>
      </div>
      <div class="size-item">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" width="24" height="24">
          <circle cx="32" cy="32" r="10" fill="#000" opacity=".95"/>
          <circle cx="32" cy="10" r="4" fill="#000" opacity=".4"/>
          <circle cx="32" cy="54" r="4" fill="#000" opacity=".4"/>
          <circle cx="10" cy="32" r="4" fill="#000" opacity=".4"/>
          <circle cx="54" cy="32" r="4" fill="#000" opacity=".4"/>
        </svg>
        <span class="size-label">24px</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-label">Favicon / App Icon 版本</div>
    <div class="size-row" style="gap:20px">
      <div class="size-item">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" width="80" height="80">
          <defs>
            <radialGradient id="orb1" cx="0" cy="0" r="1" gradientTransform="translate(21 18) rotate(48) scale(33)">
              <stop stop-color="#ffffff"/>
              <stop offset="0.38" stop-color="#80807d"/>
              <stop offset="1" stop-color="#101010"/>
            </radialGradient>
          </defs>
          <rect width="64" height="64" rx="18" fill="#f5f1ea"/>
          <circle cx="32" cy="32" r="15" fill="url(#orb1)"/>
          <circle cx="32" cy="32" r="23.5" stroke="#1a1a1a" stroke-opacity=".1"/>
        </svg>
        <span class="size-label">当前 favicon</span>
      </div>
      <div class="size-item">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" width="80" height="80">
          <rect width="64" height="64" rx="16" fill="#000"/>
          <line x1="32" y1="32" x2="32" y2="14" stroke="#fff" stroke-width="1" stroke-opacity=".2"/>
          <line x1="32" y1="32" x2="32" y2="50" stroke="#fff" stroke-width="1" stroke-opacity=".2"/>
          <line x1="32" y1="32" x2="14" y2="32" stroke="#fff" stroke-width="1" stroke-opacity=".2"/>
          <line x1="32" y1="32" x2="50" y2="32" stroke="#fff" stroke-width="1" stroke-opacity=".2"/>
          <line x1="32" y1="32" x2="19.9" y2="19.9" stroke="#fff" stroke-width="1" stroke-opacity=".1"/>
          <line x1="32" y1="32" x2="44.1" y2="19.9" stroke="#fff" stroke-width="1" stroke-opacity=".1"/>
          <line x1="32" y1="32" x2="19.9" y2="44.1" stroke="#fff" stroke-width="1" stroke-opacity=".1"/>
          <line x1="32" y1="32" x2="44.1" y2="44.1" stroke="#fff" stroke-width="1" stroke-opacity=".1"/>
          <circle cx="32" cy="10" r="4.5" fill="#fff" opacity=".5"/>
          <circle cx="32" cy="54" r="4.5" fill="#fff" opacity=".5"/>
          <circle cx="10" cy="32" r="4.5" fill="#fff" opacity=".5"/>
          <circle cx="54" cy="32" r="4.5" fill="#fff" opacity=".5"/>
          <circle cx="16.7" cy="16.7" r="3.2" fill="#fff" opacity=".3"/>
          <circle cx="47.3" cy="16.7" r="3.2" fill="#fff" opacity=".3"/>
          <circle cx="16.7" cy="47.3" r="3.2" fill="#fff" opacity=".3"/>
          <circle cx="47.3" cy="47.3" r="3.2" fill="#fff" opacity=".3"/>
          <circle cx="32" cy="32" r="10" fill="#fff" opacity=".95"/>
        </svg>
        <span class="size-label">黑底版 icon</span>
      </div>
    </div>
  </div>

</div>
</body>
</html>
